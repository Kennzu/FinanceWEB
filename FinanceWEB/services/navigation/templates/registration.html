{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{% static 'css/style_registration.css' %}" type="text/css">
</head>

<body>
    <header>
        <div class="header-navbar">
            <nav class="header-navbar-section">
                <div class="left-section">
                    <a href="{% url 'main' %}" class="navbar-link-text">Главная</a>
                    <a href="https://pay.cloudtips.ru/p/2ea5711c" class="navbar-link-text">Поддержите нас</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="list-group-main">
            <div class="rectangle-authorize">
                 <div class="behind-rectangle-authorize">
                    <h1 class="text-header">Регистрация</h1>
                    <form action="" method="post">
                        <div class="form-group">
                            <label>Электронная почта</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Логин</label>
                            <input type="login" name="login" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Подтвердите пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <input type="submit" name="submit" class="btn btn-primary" value="Зарегистрироваться">
                        </div>
                        <p class="text">У вас уже есть аккаунт?
                            <a href="{% url 'auth' %}" class="link-registration">Зарегистрироваться</a>
                        </p>
                    </form>
                 </div>
            </div>
        </div>
    </main>

    <footer>
        <nav class="footer-navbar">
            <div class="left-section-footer">
                <p class="contacts">Для партнеров - 8(905)799-38-87<br>
                   Тех.поддержка - <a class="link-tgbot" href="#">@support_tfsp</a>
                </p>
            </div>
            <div class="text-root">
                Все права защищены ©
            </div>
            <div class="right-section-footer">
                <div class="logo">
                    <p class="logo-team">TFSP</p>
                    <p class="logo-team-under-text">TEAM FINANCE SOURCE PROJECT</p>
                </div>
            </div>
        </nav>
    </footer>
</body>
